<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atlas Web Admin & Writing Studio</title>
<link rel="stylesheet" href="/css/normalize.css">
<style>
  :root {
    --bg-dark: #0b0f19;
    --bg-panel: #131b2e;
    --bg-card: rgba(19, 27, 46, 0.7);
    --border-color: #232f48;
    --accent-blue: #818cf8;
    --accent-cyan: #38bdf8;
    --accent-amber: #f59e0b;
    --accent-emerald: #34d399;
    --text-bright: #f8fafc;
    --text-muted: #cbd5e1;
    --text-dim: #94a3b8;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 0;
    background: var(--bg-dark);
    color: var(--text-bright);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Admin Header */
  .admin-header {
    height: 56px;
    background: var(--bg-panel);
    border-bottom: 1px solid var(--border-color);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 1.25rem;
    flex-shrink: 0;
  }

  .admin-logo {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    font-weight: 700;
    font-size: 1.1rem;
    color: var(--accent-cyan);
  }

  .admin-status {
    font-size: 0.85rem;
    color: var(--text-dim);
  }

  .admin-status strong {
    color: var(--accent-amber);
  }

  .admin-actions {
    display: flex;
    gap: 0.75rem;
  }

  .btn {
    background: var(--border-color);
    color: var(--text-bright);
    border: 1px solid var(--border-color);
    padding: 0.45rem 1rem;
    border-radius: 6px;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
    transition: all 0.15s ease;
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
  }

  .btn:hover { background: #334155; }
  .btn-primary {
    background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
    color: #0b0f19;
    border: none;
  }
  .btn-primary:hover { opacity: 0.9; }

  /* Studio Workspace Grid */
  .admin-workspace {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* Sidebar File Browser */
  .file-sidebar {
    width: 280px;
    background: var(--bg-panel);
    border-right: 1px solid var(--border-color);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
  }

  .sidebar-search {
    padding: 0.75rem;
    border-bottom: 1px solid var(--border-color);
  }

  .sidebar-search input {
    width: 100%;
    background: var(--bg-dark);
    border: 1px solid var(--border-color);
    color: var(--text-bright);
    padding: 0.45rem 0.75rem;
    border-radius: 6px;
    font-size: 0.85rem;
  }

  .file-list {
    flex: 1;
    overflow-y: auto;
    padding: 0.5rem;
  }

  .file-item {
    padding: 0.5rem 0.75rem;
    border-radius: 6px;
    font-size: 0.85rem;
    color: var(--text-muted);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 0.25rem;
  }

  .file-item:hover { background: rgba(255, 255, 255, 0.04); }
  .file-item.active { background: rgba(56, 189, 248, 0.15); color: var(--accent-cyan); font-weight: 600; }

  /* Split Pane Editor */
  .editor-container {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .editor-toolbar {
    height: 44px;
    background: #0f172a;
    border-bottom: 1px solid var(--border-color);
    display: flex;
    align-items: center;
    padding: 0 1rem;
    gap: 0.5rem;
    flex-shrink: 0;
  }

  .tool-btn {
    background: transparent;
    border: 1px solid var(--border-color);
    color: var(--text-dim);
    padding: 0.25rem 0.6rem;
    border-radius: 4px;
    font-size: 0.8rem;
    cursor: pointer;
  }
  .tool-btn:hover { background: rgba(255, 255, 255, 0.08); color: var(--text-bright); }

  .split-pane {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 1fr;
    overflow: hidden;
  }

  .pane-editor {
    display: flex;
    flex-direction: column;
    border-right: 1px solid var(--border-color);
  }

  .pane-editor textarea {
    flex: 1;
    width: 100%;
    background: var(--bg-dark);
    color: var(--text-bright);
    border: none;
    padding: 1.25rem;
    font-family: 'Fira Code', Consolas, Monaco, monospace;
    font-size: 0.95rem;
    line-height: 1.6;
    resize: none;
    outline: none;
  }

  .pane-preview {
    background: var(--bg-dark);
    padding: 1.5rem 2rem;
    overflow-y: auto;
    color: var(--text-muted);
  }

  .pane-preview h1, .pane-preview h2, .pane-preview h3 { color: var(--text-bright); }
  .pane-preview blockquote {
    border-left: 3px solid var(--accent-cyan);
    margin: 1rem 0;
    padding-left: 1rem;
    color: var(--text-dim);
  }

  /* Toast Notification */
  .toast {
    position: fixed;
    bottom: 1.5rem;
    right: 1.5rem;
    background: var(--accent-emerald);
    color: #0b0f19;
    padding: 0.75rem 1.25rem;
    border-radius: 8px;
    font-weight: 700;
    font-size: 0.9rem;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    display: none;
    z-index: 100;
  }
</style>
</head>
<body>

<header class="admin-header">
  <div class="admin-logo">
    <span>✨ Project Atlas</span>
    <span style="font-size: 0.75rem; color: var(--accent-blue); background: rgba(129,140,248,0.15); padding: 2px 8px; border-radius: 10px;">STUDIO</span>
  </div>
  <div class="admin-status">
    Active File: <strong id="active-file-label">None Selected</strong>
  </div>
  <div class="admin-actions">
    <button class="btn" id="btn-new-file">+ New Article</button>
    <button class="btn btn-primary" id="btn-save">💾 Save & Rebuild (Ctrl+S)</button>
    <a href="/" target="_blank" class="btn">🌐 Live Site</a>
    <button class="btn" style="background: var(--accent-amber); margin-left: 1rem;" onclick="generatePasscode()">🔑 Generate Passcode</button>
  </div>
</header>

<div class="admin-workspace">
  <!-- Left Sidebar File Browser -->
  <aside class="file-sidebar">
    <div class="sidebar-search">
      <input type="search" id="file-search" placeholder="Filter files (articles, topics, projects)...">
    </div>
    <div class="file-list" id="file-list">
      <div style="padding: 1rem; color: var(--text-dim); font-size: 0.85rem;">Loading files...</div>
    </div>
  </aside>

  <!-- Split Pane Writing Studio -->
  <main class="editor-container">
    <div class="editor-toolbar">
      <button class="tool-btn" onclick="insertSnippet('## ')">H2</button>
      <button class="tool-btn" onclick="insertSnippet('### ')">H3</button>
      <button class="tool-btn" onclick="insertSnippet('**', '**')">Bold</button>
      <button class="tool-btn" onclick="insertSnippet('> ')">Quote</button>
      <button class="tool-btn" onclick="insertSnippet('```text\n', '\n```')">Code</button>
      <button class="tool-btn" style="color: var(--accent-amber);" onclick="insertSnippet('access: paid\n')">🔒 Gated Paid Tier</button>
      <button class="tool-btn" style="color: var(--accent-cyan);" onclick="insertSnippet('audio: /audio/narrative.mp3\n')">🎙️ Audio Narration</button>
    </div>
    <div class="split-pane">
      <div class="pane-editor">
        <textarea id="markdown-editor" placeholder="Select a markdown file from the sidebar to start writing..."></textarea>
      </div>
      <div class="pane-preview" id="live-preview">
        <div style="color: var(--text-dim); margin-top: 2rem; text-align: center;">
          <h3>Live Preview Pane</h3>
          <p>Markdown changes will render here in real-time as you write.</p>
        </div>
      </div>
    </div>
  </main>
</div>

<div class="toast" id="toast">✓ File saved and site rebuilt!</div>

<script>
  let filesData = [];
  let currentRelPath = "";

  document.addEventListener("DOMContentLoaded", () => {
    loadFilesList();

    const editor = document.getElementById("markdown-editor");
    const preview = document.getElementById("live-preview");
    const saveBtn = document.getElementById("btn-save");
    const newBtn = document.getElementById("btn-new-file");
    const searchInput = document.getElementById("file-search");

    editor.addEventListener("input", () => {
      renderPreview(editor.value);
    });

    saveBtn.addEventListener("click", saveCurrentFile);

    document.addEventListener("keydown", (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === "s") {
        e.preventDefault();
        saveCurrentFile();
      }
    });

    newBtn.addEventListener("click", createNewArticlePrompt);

    searchInput.addEventListener("input", (e) => {
      filterFilesList(e.target.value.toLowerCase());
    });
  });

  async function loadFilesList() {
    try {
      const res = await fetch("/api/files");
      const data = await res.json();
      if (data.status === "ok") {
        filesData = data.files;
        renderFilesList(filesData);
        if (filesData.length > 0) {
          loadFile(filesData[0].relPath);
        }
      }
    } catch (err) {
      console.error("Failed to load files:", err);
    }
  }

  // 30-Day Expiring Passcode Generator
  function generatePasscode() {
    const SECRET = "AtlasPass2026"; // Hardcoded secret for static site HMAC-lite
    const now = Date.now();
    const expires = now + (30 * 24 * 60 * 60 * 1000); // 30 days
    const payload = expires.toString() + SECRET;
    
    // Simple hash (cyrb53) for the signature
    const cyrb53 = (str, seed = 0) => {
      let h1 = 0xdeadbeef ^ seed, h2 = 0x41c6ce57 ^ seed;
      for (let i = 0, ch; i < str.length; i++) {
        ch = str.charCodeAt(i);
        h1 = Math.imul(h1 ^ ch, 2654435761);
        h2 = Math.imul(h2 ^ ch, 1597334677);
      }
      h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507);
      h1 ^= Math.imul(h2 ^ (h2 >>> 13), 3266489909);
      h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507);
      h2 ^= Math.imul(h1 ^ (h1 >>> 13), 3266489909);
      return 4294967296 * (2097151 & h2) + (h1 >>> 0);
    };
    
    const sig = cyrb53(payload).toString(16);
    const tokenObj = { e: expires, s: sig };
    const tokenStr = "Atlas-" + btoa(JSON.stringify(tokenObj));
    
    // Copy to clipboard
    navigator.clipboard.writeText(tokenStr).then(() => {
      alert("Passcode generated and copied to clipboard!\n\n" + tokenStr + "\n\nExpires in 30 days.");
    }).catch(err => {
      alert("Failed to copy. Passcode: " + tokenStr);
    });
  }

  function renderFilesList(files) {
    const listEl = document.getElementById("file-list");
    listEl.innerHTML = files.map(f => `
      <div class="file-item ${f.relPath === currentRelPath ? 'active' : ''}" onclick="loadFile('${f.relPath}')">
        <span>📄 ${escapeHtml(f.name)}</span>
        <small style="font-size: 10px; color: var(--text-dim);">${escapeHtml(f.relPath.split('/')[0])}</small>
      </div>
    `).join("");
  }

  function filterFilesList(query) {
    const filtered = filesData.filter(f => f.relPath.toLowerCase().includes(query) || f.name.toLowerCase().includes(query));
    renderFilesList(filtered);
  }

  async function loadFile(relPath) {
    currentRelPath = relPath;
    document.getElementById("active-file-label").textContent = relPath;
    renderFilesList(filesData);

    try {
      const res = await fetch(`/api/file?path=${encodeURIComponent(relPath)}`);
      const data = await res.json();
      if (data.status === "ok") {
        const editor = document.getElementById("markdown-editor");
        editor.value = data.content;
        renderPreview(data.content);
      }
    } catch (err) {
      console.error("Failed to load file:", err);
    }
  }

  async function saveCurrentFile() {
    if (!currentRelPath) return;
    const content = document.getElementById("markdown-editor").value;
    try {
      const res = await fetch("/api/save", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ relPath: currentRelPath, content })
      });
      const data = await res.json();
      if (data.status === "ok") {
        showToast("✓ Saved & Rebuilt Successfully!");
      } else {
        alert("Error saving: " + data.message);
      }
    } catch (err) {
      alert("Failed to save file: " + err.message);
    }
  }

  async function createNewArticlePrompt() {
    const title = prompt("Enter title for new article:", "My New Story");
    if (!title) return;
    const slug = title.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
    const relPath = `articles/${slug}.md`;
    const template = `---
id: ${slug}
title: "${title}"
type: article
access: public
status: draft
author: Jonathan Thoms
summary: Write a brief summary here...
topics:
  - technology
themes:
  - curiosity
tags:
  - new-article
created: ${new Date().toISOString().split('T')[0]}
updated: ${new Date().toISOString().split('T')[0]}
---

# ${title}

> Write your opening quote or teaser here...

## Overview

Start writing your article content here...
`;

    currentRelPath = relPath;
    document.getElementById("markdown-editor").value = template;
    document.getElementById("active-file-label").textContent = relPath;
    renderPreview(template);
    await saveCurrentFile();
    await loadFilesList();
  }

  function renderPreview(text) {
    const preview = document.getElementById("live-preview");
    // Strip YAML front matter for preview
    let content = text;
    if (text.startsWith("---")) {
      const end = text.indexOf("---", 3);
      if (end !== -1) {
        content = text.slice(end + 3);
      }
    }

    // Basic Markdown parser for live studio preview
    let html = escapeHtml(content)
      .replace(/^### (.*$)/gim, '<h3>$1</h3>')
      .replace(/^## (.*$)/gim, '<h2>$1</h2>')
      .replace(/^# (.*$)/gim, '<h1>$1</h1>')
      .replace(/^> (.*$)/gim, '<blockquote>$1</blockquote>')
      .replace(/\*\*(.*)\*\*/gim, '<strong>$1</strong>')
      .replace(/\*(.*)\*/gim, '<em>$1</em>')
      .replace(/\n\n/g, '<br><br>');

    preview.innerHTML = html;
  }

  function insertSnippet(prefix, suffix = "") {
    const editor = document.getElementById("markdown-editor");
    const start = editor.selectionStart;
    const end = editor.selectionEnd;
    const text = editor.value;
    const selected = text.substring(start, end);
    const replacement = prefix + selected + suffix;
    editor.value = text.substring(0, start) + replacement + text.substring(end);
    editor.focus();
    renderPreview(editor.value);
  }

  function showToast(msg) {
    const toast = document.getElementById("toast");
    toast.textContent = msg;
    toast.style.display = "block";
    setTimeout(() => { toast.style.display = "none"; }, 3000);
  }

  function escapeHtml(str) {
    return String(str || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }
</script>
</body>
</html>
