<section class="theme-header">
    <span class="type-badge">Theme</span>
    <h1>{{title}}</h1>
    <div class="theme-body"><p>{{summary}}</p></div>
</section>

<section class="graph-container">
    <h2>Theme Connections</h2>
    <div id="graph-canvas" class="graph-canvas" data-focus-id="{{id}}"></div>
</section>

<section class="theme-prose">
    {{body}}
</section>

<section>
    <h2>Connected Articles</h2>
    {{articles}}
</section>

<section>
    <h2>Connected Topics</h2>
    {{topics}}
</section>
