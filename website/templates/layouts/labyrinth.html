<div id="labyrinth-container" style="width: 100vw; height: 100vh; background: #0b0f19; position: relative; overflow: hidden; margin: 0; padding: 0;">
    
    <!-- UI Overlay -->
    <div style="position: absolute; top: 1rem; left: 1rem; z-index: 10; display: flex; align-items: center; gap: 1rem;">
        <a href="/" style="background: var(--bg-surface); border: 1px solid var(--border-color); color: var(--text-main); padding: 0.5rem 1rem; border-radius: var(--radius-md); text-decoration: none; font-weight: bold; font-family: monospace;">← Exit Labyrinth</a>
        
        <div style="background: rgba(19, 27, 46, 0.8); border: 1px solid var(--border-color); padding: 0.5rem 1rem; border-radius: var(--radius-md); color: var(--text-main); font-family: monospace;">
            Soul Room: <span id="current-room-label" style="color: var(--accent-cyan); font-weight: bold;">Loading...</span>
        </div>
    </div>

    <!-- The Isometric Canvas -->
    <canvas id="labyrinth-canvas" style="display: block; width: 100%; height: 100%; touch-action: none;"></canvas>
    
    <!-- Controls Hint -->
    <div style="position: absolute; bottom: 1rem; right: 1rem; background: rgba(19, 27, 46, 0.8); border: 1px solid var(--border-color); padding: 0.5rem 1rem; border-radius: var(--radius-md); color: var(--text-muted); font-size: 0.8rem; font-family: monospace; pointer-events: none;">
        Drag to Pan • Click Doors to Traverse
    </div>
</div>

<script src="/js/labyrinth.js"></script>
