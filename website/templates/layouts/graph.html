<section class="graph-container" style="position: relative; margin-top: 1rem; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.3); border: 1px solid var(--border-color);">
    <div style="background: var(--bg-element); padding: 1rem; border-bottom: 1px solid var(--border-color); text-align: center;">
        <h1 style="margin: 0; color: var(--accent-blue); font-size: 1.5rem;">The Digital Garden Map</h1>
        <div style="font-size: 0.9rem; color: var(--text-muted); opacity: 0.8; letter-spacing: 0.05em; text-transform: uppercase;">Viewing all connections</div>
    </div>
    
    <div id="graph-canvas" class="graph-canvas" data-focus-type="full" style="height: 85vh; width: 100%; background: var(--bg-card); position: relative;">
        <!-- Search Bar Overlay -->
        <div style="position: absolute; top: 20px; right: 20px; z-index: 100; display: flex; align-items: center; gap: 8px;">
            <input type="text" id="graph-search" placeholder="Search the map..." style="padding: 0.8rem 1rem; border-radius: 8px; border: 1px solid var(--accent-cyan); background: rgba(0,0,0,0.7); color: #fff; width: 230px; font-size: 1rem; backdrop-filter: blur(5px); box-shadow: 0 4px 10px rgba(0,0,0,0.5); outline: none;">
            <button id="graph-reset-btn" type="button" title="Reset Graph Layout" style="padding: 0.8rem 1rem; border-radius: 8px; border: 1px solid var(--border-color); background: rgba(0,0,0,0.7); color: var(--accent-cyan); font-size: 0.95rem; font-weight: 600; cursor: pointer; backdrop-filter: blur(5px); box-shadow: 0 4px 10px rgba(0,0,0,0.5); display: inline-flex; align-items: center; gap: 0.35rem; transition: all 0.2s;">
                ↺ Reset
            </button>
        </div>
    </div>
</section>

<style>
    .graph-canvas canvas {
        display: block;
        width: 100%;
        height: 100%;
        cursor: pointer;
    }
</style>
