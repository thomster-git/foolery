<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#060b14"/>
    </radialGradient>
    <radialGradient id="glowCenter" cx="50%" cy="42%" r="30%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#glowCenter)"/>

  <!-- Border -->
  <rect x="2" y="2" width="1196" height="626" rx="12" fill="none" stroke="#38bdf840" stroke-width="2"/>

  <!-- Knowledge graph — edges -->
  <g opacity="0.35" stroke="#38bdf8" stroke-width="1.5">
    <line x1="600" y1="220" x2="480" y2="160"/>
    <line x1="600" y1="220" x2="720" y2="160"/>
    <line x1="600" y1="220" x2="540" y2="290"/>
    <line x1="600" y1="220" x2="660" y2="290"/>
    <line x1="600" y1="220" x2="440" y2="240"/>
    <line x1="600" y1="220" x2="760" y2="240"/>
    <line x1="480" y1="160" x2="410" y2="130"/>
    <line x1="720" y1="160" x2="790" y2="130"/>
    <line x1="440" y1="240" x2="380" y2="290"/>
    <line x1="760" y1="240" x2="820" y2="290"/>
  </g>

  <!-- Knowledge graph — nodes -->
  <g filter="url(#glow)">
    <!-- Central node -->
    <circle cx="600" cy="220" r="14" fill="#38bdf8" opacity="0.95"/>
    <!-- Primary nodes -->
    <circle cx="480" cy="160" r="8" fill="#818cf8" opacity="0.9"/>
    <circle cx="720" cy="160" r="8" fill="#818cf8" opacity="0.9"/>
    <circle cx="540" cy="290" r="7" fill="#34d399" opacity="0.85"/>
    <circle cx="660" cy="290" r="7" fill="#34d399" opacity="0.85"/>
    <circle cx="440" cy="240" r="6" fill="#c084fc" opacity="0.8"/>
    <circle cx="760" cy="240" r="6" fill="#c084fc" opacity="0.8"/>
    <!-- Secondary nodes -->
    <circle cx="410" cy="130" r="5" fill="#fbbf24" opacity="0.7"/>
    <circle cx="790" cy="130" r="5" fill="#fbbf24" opacity="0.7"/>
    <circle cx="380" cy="290" r="4" fill="#818cf8" opacity="0.65"/>
    <circle cx="820" cy="290" r="4" fill="#818cf8" opacity="0.65"/>
  </g>

  <!-- Site name -->
  <text x="600" y="390" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-weight="700" font-size="78" fill="#f1f5f9" text-anchor="middle" letter-spacing="-1">
    Thoms Foolery
  </text>

  <!-- Tagline -->
  <text x="600" y="450" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-weight="400" font-size="28" fill="#38bdf8" text-anchor="middle" letter-spacing="0.5">
    Everything is Connected.
  </text>

  <!-- URL -->
  <text x="600" y="580" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-weight="400" font-size="20" fill="#475569" text-anchor="middle">
    thomsfoolery.com
  </text>
</svg>
