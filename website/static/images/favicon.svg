<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="fav-cyan-indigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="fav-indigo-amber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>

  <rect width="48" height="48" rx="10" fill="#0b0f19"/>
  <rect width="46" height="46" x="1" y="1" rx="9" fill="none" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1"/>

  <!-- Scaled TF Ligature Net -->
  <g transform="translate(4, 4) scale(0.3333)" stroke-linecap="round" stroke-linejoin="round">
    <!-- T Top Bar -->
    <line x1="22" y1="28" x2="42" y2="28" stroke="#38bdf8" stroke-width="4.5"/>
    <line x1="42" y1="28" x2="60" y2="28" stroke="#38bdf8" stroke-width="4.5"/>
    <line x1="22" y1="28" x2="22" y2="40" stroke="#38bdf8" stroke-width="3.5"/>
    <line x1="22" y1="40" x2="48" y2="44" stroke="#38bdf8" stroke-width="3"/>
    <line x1="42" y1="28" x2="48" y2="44" stroke="#38bdf8" stroke-width="3"/>

    <!-- F Top Bar -->
    <line x1="60" y1="28" x2="78" y2="28" stroke="url(#fav-indigo-amber)" stroke-width="4.5"/>
    <line x1="78" y1="28" x2="98" y2="28" stroke="#fbbf24" stroke-width="4.5"/>
    <line x1="98" y1="28" x2="98" y2="40" stroke="#fbbf24" stroke-width="3.5"/>
    <line x1="98" y1="40" x2="78" y2="28" stroke="#fbbf24" stroke-width="3"/>
    <line x1="78" y1="28" x2="74" y2="42" stroke="url(#fav-indigo-amber)" stroke-width="3"/>

    <!-- Central Spine -->
    <line x1="60" y1="28" x2="48" y2="44" stroke="#38bdf8" stroke-width="3.5"/>
    <line x1="60" y1="28" x2="60" y2="48" stroke="#818cf8" stroke-width="4.5"/>
    <line x1="48" y1="44" x2="60" y2="48" stroke="#818cf8" stroke-width="3"/>
    <line x1="48" y1="44" x2="48" y2="68" stroke="#38bdf8" stroke-width="3.5"/>
    <line x1="60" y1="48" x2="60" y2="74" stroke="#818cf8" stroke-width="4.5"/>
    <line x1="48" y1="68" x2="60" y2="74" stroke="#818cf8" stroke-width="3"/>

    <!-- F Mid Crossbar -->
    <line x1="60" y1="48" x2="76" y2="58" stroke="url(#fav-indigo-amber)" stroke-width="3.5"/>
    <line x1="76" y1="58" x2="92" y2="58" stroke="#fbbf24" stroke-width="4.5"/>
    <line x1="92" y1="58" x2="84" y2="70" stroke="#fbbf24" stroke-width="3.5"/>
    <line x1="76" y1="58" x2="84" y2="70" stroke="#f59e0b" stroke-width="3"/>
    <line x1="60" y1="74" x2="76" y2="58" stroke="url(#fav-indigo-amber)" stroke-width="3"/>

    <!-- Stem Base -->
    <line x1="48" y1="68" x2="48" y2="92" stroke="#38bdf8" stroke-width="3.5"/>
    <line x1="60" y1="74" x2="60" y2="98" stroke="#38bdf8" stroke-width="4.5"/>
    <line x1="48" y1="92" x2="60" y2="98" stroke="#38bdf8" stroke-width="3.5"/>

    <!-- Nodes -->
    <circle cx="22" cy="28" r="5" fill="#38bdf8"/>
    <circle cx="22" cy="28" r="2.5" fill="#ffffff"/>
    <circle cx="42" cy="28" r="4.2" fill="#38bdf8"/>
    <circle cx="22" cy="40" r="4" fill="#38bdf8"/>
    <circle cx="48" cy="44" r="4.5" fill="#38bdf8"/>

    <circle cx="60" cy="28" r="5.8" fill="#38bdf8"/>
    <circle cx="60" cy="28" r="2.8" fill="#ffffff"/>
    <circle cx="60" cy="48" r="5" fill="#818cf8"/>
    <circle cx="60" cy="48" r="2.5" fill="#ffffff"/>
    <circle cx="48" cy="68" r="4.2" fill="#38bdf8"/>
    <circle cx="60" cy="74" r="5.2" fill="#818cf8"/>
    <circle cx="60" cy="74" r="2.5" fill="#ffffff"/>

    <circle cx="78" cy="28" r="4.5" fill="#c084fc"/>
    <circle cx="98" cy="28" r="5.5" fill="#fbbf24"/>
    <circle cx="98" cy="28" r="2.8" fill="#ffffff"/>
    <circle cx="98" cy="40" r="4" fill="#fbbf24"/>

    <circle cx="76" cy="58" r="4.8" fill="#f59e0b"/>
    <circle cx="92" cy="58" r="5.5" fill="#fbbf24"/>
    <circle cx="92" cy="58" r="2.8" fill="#ffffff"/>
    <circle cx="84" cy="70" r="4.2" fill="#fbbf24"/>

    <circle cx="48" cy="92" r="4.2" fill="#38bdf8"/>
    <circle cx="60" cy="98" r="5.8" fill="#38bdf8"/>
    <circle cx="60" cy="98" r="2.8" fill="#ffffff"/>
