[build]
  command = "npm run build"
  publish = "website/dist"
  functions = "netlify/functions"

# Custom 404 page — must come BEFORE the SPA fallback
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
  conditions = {Role = ["404"]}

# SPA-style fallback for client-side navigation (if needed)
# Remove or comment this out if you want hard 404s for all missing pages
# [[redirects]]
#   from = "/*"
#   to = "/index.html"
#   status = 200
