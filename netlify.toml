[build]
  command = "npm run build"
  publish = "website/dist"
  functions = "netlify/functions"

# 301 Redirects for legacy indexed URLs (clears Google Search Console errors)
[[redirects]]
  from = "/watch-parties.html"
  to = "/tools/"
  status = 301
  force = true

[[redirects]]
  from = "/vods.html"
  to = "/"
  status = 301
  force = true

# Custom 404 page for missing pages
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
