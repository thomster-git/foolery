[build]
  command = "npm run build"
  publish = "website/dist"
  functions = "netlify/functions"

# 301 Redirects for legacy indexed URLs (clears Google Search Console errors)
[[redirects]]
  from = "/watch-parties.html"
  to = "/tools/"
  status = 301
  force = true

[[redirects]]
  from = "/vods.html"
  to = "/"
  status = 301
  force = true

# API Routes for Netlify Functions
[[redirects]]
  from = "/api/submit-inquiry"
  to = "/.netlify/functions/submit-inquiry"
  status = 200

# Canonical redirects for article and project slugs (prevents GSC 404s on trailing slashes)
[[redirects]]
  from = "/articles/:slug/"
  to = "/articles/:slug.html"
  status = 301

[[redirects]]
  from = "/articles/:slug"
  to = "/articles/:slug.html"
  status = 301

[[redirects]]
  from = "/projects/:slug/"
  to = "/projects/:slug.html"
  status = 301

[[redirects]]
  from = "/projects/:slug"
  to = "/projects/:slug.html"
  status = 301

# Custom 404 page for missing pages
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
